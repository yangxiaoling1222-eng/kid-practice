<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>宝贝每日练习</title>
<style>
:root{
  --bg:#FFF7EF; --card:#fff; --ink:#3A3129; --ink2:#8A7C6B; --line:#F0E4D6;
  --math:#4C86E8; --math-l:#EAF2FE;
  --py:#2FA98C; --py-l:#E6F7F2;
  --warn:#F5A63C; --warn-l:#FFF2DF;
  --bad:#E8574A; --bad-l:#FDECEA;
  --good:#2FA98C;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px; line-height:1.5;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hide{display:none!important}

/* header */
.hd{padding:16px 0 8px;display:flex;align-items:center;gap:10px}
.hd .tt{font-size:20px;font-weight:800;letter-spacing:.5px}
.hd .dt{font-size:12px;color:var(--ink2);margin-top:2px}
.avatar{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#FFD08A,#FF9A76);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex:none}

/* card */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(180,150,110,.10)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
.muted{color:var(--ink2);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}

/* 今日入口 */
.entry{display:block;width:100%;text-align:left;border-radius:var(--r);padding:16px;margin-bottom:12px;color:#fff;position:relative;overflow:hidden;cursor:pointer}
.entry.m{background:linear-gradient(135deg,#5C93F0,#3D74D6)}
.entry.p{background:linear-gradient(135deg,#43BC9C,#1F9680)}
.entry .nm{font-size:18px;font-weight:800}
.entry .ds{font-size:12px;opacity:.9;margin-top:3px}
.entry .pg{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;opacity:.95}
.entry .bar{height:5px;background:rgba(255,255,255,.35);border-radius:3px;margin-top:10px;overflow:hidden}
.entry .bar i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .4s}

/* 统计小格 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border-radius:14px;padding:12px 10px;text-align:center;box-shadow:0 2px 10px rgba(180,150,110,.08)}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.stat span{font-size:11px;color:var(--ink2)}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50;max-width:520px;margin:0 auto;box-shadow:0 -2px 14px rgba(180,150,110,.10)}
.tabs button{flex:1;padding:9px 0 7px;font-size:11px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button i{font-size:20px;font-style:normal;line-height:1}
.tabs button.on{color:var(--math);font-weight:700}

/* 题目区 */
.qbox{text-align:center;padding:26px 10px 10px}
.qtext{font-size:44px;font-weight:800;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;min-height:60px}
.qtext .n{color:var(--ink)}
.qtext .op{color:var(--math);margin:0 2px}
.qtext .bx{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:64px;border:3px dashed var(--math);border-radius:14px;color:var(--math);background:var(--math-l)}
.qtext .bx.f{border-style:solid;border-color:var(--ink2);color:var(--ink);background:#fff}
.qtext .bx.ok{border-color:var(--good);color:var(--good);background:var(--py-l)}
.qtext .bx.no{border-color:var(--bad);color:var(--bad);background:var(--bad-l)}
.qtip{font-size:13px;color:var(--ink2);margin-top:8px;min-height:20px}
.qtip.ok{color:var(--good);font-weight:700}
.qtip.no{color:var(--bad);font-weight:700}

/* 键盘 */
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 0 4px}
.kb button{background:#fff;border-radius:14px;padding:14px 0;font-size:22px;font-weight:800;box-shadow:0 2px 6px rgba(180,150,110,.14);transition:transform .08s}
.kb button:active{transform:scale(.94)}
.kb button.fn{font-size:15px;color:var(--ink2);background:#F6EFE6;box-shadow:none}
.kb button.go{background:var(--math);color:#fff;font-size:17px}

/* 拼音卡 */
.pcard{background:var(--card);border-radius:22px;padding:22px 16px;text-align:center;box-shadow:0 4px 18px rgba(180,150,110,.14);min-height:250px;display:flex;flex-direction:column;justify-content:center}
.py{font-size:40px;font-weight:800;letter-spacing:3px;line-height:1.35}
.py .a{color:var(--py)}
.py .b{color:#7C6EF0}
.py .sep{color:#DDD;font-weight:400;margin:0 8px;font-size:26px}
.hz{font-size:30px;font-weight:700;color:var(--ink);margin-top:6px;letter-spacing:8px}
.wd{font-size:14px;color:var(--ink2);margin-top:8px;letter-spacing:1px}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--py-l);color:var(--py);font-weight:700;margin-bottom:12px}
.tone-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:start}
.tone-row div{font-size:clamp(24px,7.6vw,34px);font-weight:800;color:var(--py);line-height:1.25}
.tone-row div small{display:block;font-size:14px;color:var(--ink2);font-weight:600;letter-spacing:0}
.tone-wd-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;align-items:start}
.tone-wd-row div{font-size:13px;font-weight:800;color:var(--ink);letter-spacing:0;text-align:center;line-height:1.35;padding:0 1px}

/* 按钮 */
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-size:17px;font-weight:800;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.btn.p{background:var(--math);color:#fff}
.btn.g{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.ok{background:var(--good);color:#fff}
.btn.no{background:#fff;color:var(--bad);border:2px solid #F3C9C4}
.btn:active{transform:scale(.98)}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

/* progress */
.ptop{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.ptop .bar{flex:1;height:8px;background:#F0E4D6;border-radius:4px;overflow:hidden}
.ptop .bar i{display:block;height:100%;background:var(--math);border-radius:4px;transition:width .3s}
.ptop .bar.p i{background:var(--py)}
.ptop .cnt{font-size:13px;font-weight:700;color:var(--ink2)}

/* 设置 */
.set{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .lb{font-size:15px;font-weight:600}
.set .sb{font-size:12px;color:var(--ink2);margin-top:2px}
.stepper{display:flex;align-items:center;gap:12px;flex:none}
.stepper button{width:34px;height:34px;border-radius:11px;background:#F6EFE6;font-size:19px;font-weight:800;color:var(--ink2);line-height:1}
.stepper span{min-width:34px;text-align:center;font-weight:800;font-size:18px}
.chip{font-size:13px;padding:7px 12px;border-radius:20px;background:#F6EFE6;color:var(--ink2);font-weight:600;cursor:pointer;display:inline-block}
.chip.on{background:var(--math-l);color:var(--math);box-shadow:inset 0 0 0 1.5px var(--math)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* 历史/日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{aspect-ratio:1;border-radius:9px;background:#F6EFE6;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink2);position:relative}
.cal div.l0{background:#F6EFE6}
.cal div.l1{background:#D8F0E8;color:#1F7A63;font-weight:700}
.cal div.l2{background:#8FDCC4;color:#0F5D49;font-weight:800}
.cal div.l3{background:#2FA98C;color:#fff;font-weight:800}
.cal div.td{box-shadow:0 0 0 2px var(--math)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;color:var(--ink2);text-align:center;margin-bottom:6px}

.list{display:flex;flex-direction:column;gap:8px}
.li{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(180,150,110,.08);cursor:pointer}
.li .d{font-size:13px;font-weight:800}
.li .v{font-size:12px;color:var(--ink2);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.barmini{height:6px;border-radius:3px;background:#F0E4D6;overflow:hidden;margin-top:8px}
.barmini i{display:block;height:100%;border-radius:3px}
.wrongitem{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.wrongitem:last-child{border-bottom:0}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bad-l);color:var(--bad);font-weight:700}

/* 完成页 */
.done{text-align:center;padding:20px 0}
.done .em{font-size:56px;line-height:1}
.done h2{margin:8px 0 4px;font-size:22px}
.stars{font-size:26px;letter-spacing:4px;margin:6px 0 12px}

.sheet{position:fixed;inset:0;background:rgba(40,30,20,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(50,40,30,.92);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center}
.toast.on{opacity:1}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .32s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .3s}
</style>
</head>

function dk(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function todayKey(){return dk(new Date())}
function cnDate(s){var a=s.split('-');return (+a[1])+'月'+(+a[2])+'日'}
function hash(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){var a=seed>>>0;return function(){a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function ri(r,n){return Math.floor(r()*n)}
function pick(r,arr){return arr[ri(r,arr.length)]}
function shuffle(a,r){for(var i=a.length-1;i>0;i--){var j=ri(r,i+1);var t=a[i];a[i]=a[j];a[j]=t}return a}
function pct(c,t){return t?Math.round(c/t*100):0}

/* ================= 数学出题 ================= */
function maxOf(){return S.math.level==='easy'?5:(S.math.level==='hard'?10:10)}
function genMath(seed){
  var r=rng(seed),mx=maxOf(),types=S.math.types.slice(),list=[];
  var easy=S.math.level==='easy';
  for(var i=0;i<S.math.count;i++){
    var t=types[ri(r,types.length)];
    if(easy&&(t==='chain'||t==='mix'||t==='split'))t=(i%2?'sub':'add');
    list.push(makeQ(t,mx,r,easy));
  }
  return list;
}
function mkDisp(arr){return arr.map(function(x){return typeof x==='object'?x:{v:x}})}
function makeQ(t,mx,r,easy){
  if(t==='add'){
    var a=ri(r,mx+1),b=ri(r,mx-a+1);
    return {t:t,d:mkDisp([a,'+',b,'=',{v:'?',b:1}]),ans:a+b,k:'num'};
  }
  if(t==='sub'){
    var a=1+ri(r,mx),b=ri(r,a+1);
    return {t:t,d:mkDisp([a,'-',b,'=',{v:'?',b:1}]),ans:a-b,k:'num'};
  }
  if(t==='fill'){
    var v=ri(r,4);
    if(v===0){var c=1+ri(r,mx),a=ri(r,c+1);return {t:t,d:mkDisp([a,'+',{v:'□',b:1},'=',c]),ans:c-a,k:'num'}}
    if(v===1){var c=1+ri(r,mx),b=ri(r,c+1);return {t:t,d:mkDisp([{v:'□',b:1},'+',b,'=',c]),ans:c-b,k:'num'}}
    if(v===2){var a=1+ri(r,mx),c=ri(r,a+1);return {t:t,d:mkDisp([a,'-',{v:'□',b:1},'=',c]),ans:a-c,k:'num'}}
    var b=ri(r,mx),c=ri(r,mx-b+1);return {t:t,d:mkDisp([{v:'□',b:1},'-',b,'=',c]),ans:c+b,k:'num'}
  }
  if(t==='cmp'){
    var a=ri(r,mx+1),b=ri(r,mx-a+1),s=a+b;
    var c=(ri(r,3)===0)?s:(s+1+ri(r,2)<=mx*2?s+1+ri(r,2):Math.max(0,s-1-ri(r,2)));
    return {t:t,d:mkDisp([a,'+',b,{v:'○',b:1},c]),ans:(s>c?'>':(s<c?'<':'=')),k:'cmp'};
  }
  if(t==='chain'){
    if(ri(r,2)===0){
      var a=ri(r,mx),b=ri(r,mx-a),c=ri(r,mx-a-b+1);
      return {t:t,d:mkDisp([a,'+',b,'+',c,'=',{v:'?',b:1}]),ans:a+b+c,k:'num'};
    }
    var a=3+ri(r,mx-2),b=ri(r,a),c=ri(r,a-b+1);
    return {t:t,d:mkDisp([a,'-',b,'-',c,'=',{v:'?',b:1}]),ans:a-b-c,k:'num'};
  }
  if(t==='mix'){
    var a=ri(r,mx+1),b=ri(r,mx-a+1),c=ri(r,a+b+1);
    return {t:t,d:mkDisp([a,'+',b,'-',c,'=',{v:'?',b:1}]),ans:a+b-c,k:'num'};
  }
  /* split */
  var c=2+ri(r,mx-1);
  return {t:t,d:mkDisp([c,'=',{v:'□',b:1},'+',{v:'□',b:1}]),ans:c,k:'split'};
}
function placeholder(v){return v==='?'?'?':(v==='○'?'?':'　')}
function qText(q,fill,state){
  var bi=0,h='';
  q.d.forEach(function(x){
    var v=x.v;
    if(x.b){
      var val='',filled=false;
      if(q.k==='split'){
        filled=(fill[bi]!==undefined&&fill[bi]!==null);
        val=filled?fill[bi]:placeholder(v);
      }else{
        filled=(fill[0]!==undefined&&fill[0]!==null);
        val=filled?fill[0]:placeholder(v);
      }
      var cls='bx'+(state?(state==='ok'?' ok':(state==='no'?' no':'')):'')+(filled?' f':'');
      h+='<span class="'+cls+'">'+esc(val)+'</span>';
      bi++;
    }else{
      h+='<span class="'+(['+','-','='].indexOf(v)>=0?'op':'n')+'">'+esc(v)+'</span>';
    }
  });
  return h;
}

/* ================= 拼音出题 ================= */
function parseItem(s){var a=s.split('|');return {py:a[0],hz:a[1]||'',w:a[2]||''}}
function pyPool(k){
  if(k==='tone')return TONES.map(function(s){return {kind:'tone',tag:'tone',items:s.split(',').map(parseItem),key:s}});
  if(k==='whole')return WHOLE.map(function(s){var o=parseItem(s);return {kind:'word',tag:'whole',a:o,key:s}});
  if(k==='word')return WORDS.map(function(s){var o=parseItem(s);return {kind:'word',tag:'word',a:o,key:s}});
  var src=(CONTRAST[k]||[]).filter(function(s){return s.indexOf('|?')<0});
  return src.map(function(s){var p=s.split(':');return {kind:'pair',tag:k,a:parseItem(p[0]),b:parseItem(p[1]),key:s}});
}
function itemKeys(it){return it.kind==='tone'?it.items.map(function(x){return x.py}):(it.kind==='pair'?[it.a.py,it.b.py]:[it.a.py])}
function weakScore(it){var ks=itemKeys(it),s=0;ks.forEach(function(k){if(S.weak[k])s+=S.weak[k]});return s}
function genPy(seed){
  var r=rng(seed),list=[],used={};
  PY_TYPES.forEach(function(tp){
    var n=S.py.counts[tp.k]||0,pool=pyPool(tp.k).slice(),got=0,guard=0;
    while(got<n&&guard<200){
      guard++;
      if(!pool.length)break;
      /* 40% 概率优先挑薄弱项 */
      var cand=null;
      if(r()<0.4){
        var ws=pool.filter(function(it){return weakScore(it)>0&&!used[it.key]});
        if(ws.length){ws.sort(function(a,b){return weakScore(b)-weakScore(a)});cand=ws[Math.min(ws.length-1,ri(r,Math.min(3,ws.length)))]}
      }
      if(!cand){
        var ok=pool.filter(function(it){return !used[it.key]});
        if(!ok.length)break;
        cand=ok[ri(r,ok.length)];
      }
      /* 避免同一天出现重复音节 */
      var ks=itemKeys(cand),dup=false;
      ks.forEach(function(k){if(used['@'+k])dup=true});
      if(dup&&guard<150)continue;
      used[cand.key]=1;ks.forEach(function(k){used['@'+k]=1});
      list.push(cand);got++;
    }
  });
  return shuffle(list,r);
}

function finish(){
  var d=todayKey(),R=rec(d),ms=Date.now()-SS.t0,k=R[SS.kind];
  k.t+=SS.list.length;k.c+=SS.ok;k.ms=(k.ms||0)+ms;
  SS.wrong.forEach(function(w){
    if(SS.kind==='math'){
      k.w.unshift({q:w.q,ans:w.ans,t:w.t,cn:w.cn});
    }else{
      k.w.unshift({py:w.py,hz:w.hz,tag:w.tag});
      S.weak[w.py]=(S.weak[w.py]||0)+1;
    }
  });
  SS.list.forEach(function(q){
    if(SS.kind==='math'){var t=q.t;if(!k.ty[t])k.ty[t]={t:0,c:0};k.ty[t].t++;k.ty[t].c++}
    else{var tg=q.tag;if(!k.ty[tg])k.ty[tg]={t:0,c:0};k.ty[tg].t++;k.ty[tg].c++}
  });
  SS.wrong.forEach(function(w){
    if(SS.kind==='math'){if(k.ty[w.t])k.ty[w.t].c--}
    else{if(k.ty[w.tag])k.ty[w.tag].c--}
  });
  if(k.w.length>60)k.w.length=60;
  save();
}

function levelName(){return S.math.level==='easy'?'5以内':(S.math.level==='hard'?'10以内·全题型':'10以内')}
function typeNames(){return S.math.types.map(function(k){var t=MATH_TYPES.filter(function(x){return x.k===k})[0];return t?t.n:''}).join('、')}

function streak(){

function submit(){
  if(SS.lock)return;

    h+='<div class="card"><h3>📋 每日记录</h3><div class="list">';
    ks.forEach(function(k){
      var r=S.records[k],mp=pct(r.math.c,r.math.t),pp=pct(r.py.c,r.py.t);
      h+='<div class="li" onclick="openDay(\''+k+'\')"><div class="between"><span class="d">'+cnDate(k)+' ›</span><span class="muted">'+(r.math.t?Math.round(r.math.ms/1000)+'s':'')+'</span></div>';
      h+='<div class="v"><span style="color:var(--math)">数学 '+r.math.c+'/'+r.math.t+'（'+mp+'%）</span><span style="color:var(--py)">拼音 '+r.py.c+'/'+r.py.t+'（'+pp+'%）</span></div>';
      h+='<div class="barmini"><i style="width:'+((mp+pp)/2)+'%;background:var(--math)"></i></div></div>';
    });
    h+='</div></div>';
  }
  return h;
}
function aggTy(kind){
  var ty={},d=new Date();
  for(var i=0;i<30;i++){
    var r=S.records[dk(d)];
    if(r&&r[kind]&&r[kind].ty){for(var k in r[kind].ty){if(!ty[k])ty[k]={t:0,c:0};ty[k].t+=r[kind].ty[k].t;ty[k].c+=r[kind].ty[k].c}}
    d.setDate(d.getDate()-1);
  }
  return ty;
}
function collectMathWrong(n){
  var out=[],ks=Object.keys(S.records).sort().reverse();
  for(var i=0;i<ks.length&&out.length<n;i++){
    var r=S.records[ks[i]];
    (r.math.w||[]).forEach(function(w){if(out.length<n)out.push({q:w.q.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(),ans:w.ans,t:w.t,d:ks[i]})});
  }
  return out;
}
function redoAll(){
  var mw=collectMathWrong(20);
  var out=mw.map(function(w){
    var s=w.q.replace(/\s+/g,' ').trim();
    var q={t:w.t,ans:w.ans,k:(w.t==='cmp'?'cmp':(w.t==='split'?'split':'num'))};
    q.d=mkDisp(s.split(' ').map(function(x){return (x==='□'||x==='?'||x==='○')?{v:x,b:1}:x}));
    return q;
  }).filter(function(q){return q.d.length>1});
  if(!out.length){toast('暂时没有错题');return}
  startMath(out);SS.redo=1;render();
}
function openDay(k){
  var r=S.records[k];if(!r)return;
  var mp=pct(r.math.c,r.math.t),pp=pct(r.py.c,r.py.t);
  var b='<div class="card" style="box-shadow:none;padding:12px 0">';
  b+='<div class="grid4"><div class="stat"><b style="color:var(--math)">'+r.math.c+'/'+r.math.t+'</b><span>数学</span></div>';
  b+='<div class="stat"><b style="color:var(--math)">'+mp+'%</b><span>正确率</span></div>';
  b+='<div class="stat"><b style="color:var(--py)">'+r.py.c+'/'+r.py.t+'</b><span>拼音</span></div>';
  b+='<div class="stat"><b style="color:var(--py)">'+pp+'%</b><span>读对率</span></div></div>';
  if((r.math.w||[]).length){
    b+='<div style="margin-top:12px;font-weight:800;font-size:14px">❌ 数学错题</div>';
    r.math.w.slice(0,12).forEach(function(w){
      b+='<div class="wrongitem"><span>'+w.q.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()+'　答案 <b>'+w.ans+'</b></span><span class="muted">答了 '+w.cn+'</span></div>';
    });
  }
  if((r.py.w||[]).length){
    b+='<div style="margin-top:12px;font-weight:800;font-size:14px">🔁 读错的音</div>';
    r.py.w.slice(0,12).forEach(function(w){
      b+='<div class="wrongitem"><b style="font-size:16px;letter-spacing:1px">'+esc(w.py)+'</b><span class="muted">'+esc(w.hz)+'</span></div>';
    });
  }
  if(!(r.math.w||[]).length&&!(r.py.w||[]).length)b+='<div class="muted" style="margin-top:12px">这一天全对，没有错题 🎉</div>';
  b+='</div>';
  openSheet('<h3 style="margin:0 0 4px">'+cnDate(k)+' 练习详情</h3><div class="muted">用时 '+(r.math.t?Math.round(r.math.ms/1000)+' 秒':'—')+'</div>',b,[{t:'知道了',c:'p',f:closeSheet}]);
}
function calHTML(n){
  var d=new Date();d.setDate(d.getDate()-(n-1));
  var startPad=new Date(d).getDay();
  var h='';
  for(var i=0;i<startPad;i++)h+='<div style="background:transparent"></div>';
  for(var i=0;i<n;i++){
    var k=dk(d),r=S.records[k];
    var mt=r&&r.math?r.math.t:0,pt=r&&r.py?r.py.t:0;
    var goal=(S.math.count||10)+(pyTotal()||10);
    var v=(mt+pt)/goal;
    var lv=mt+pt===0?0:(v>=1?3:(v>=0.5?2:1));
    h+='<div class="l'+lv+(k===todayKey()?' td':'')+'">'+(+k.split('-')[2])+'</div>';
    d.setDate(d.getDate()+1);
  }
  return h;
}
function trendSVG(md,pd,days){
  var W=300,H=90,pl=6,pr=6,pb=16,pt=6;
  var n=md.length,step=(W-pl-pr)/(n-1);
  function y(v){return H-pb-v*(H-pt-pb)}
  function path(arr){
    var segs=[],cur=[];
    arr.forEach(function(v,i){
      if(v===null){if(cur.length)segs.push(cur);cur=[]}
      else cur.push([pl+i*step,y(v)]);
    });
    if(cur.length)segs.push(cur);
    return segs.map(function(s){return 'M'+s.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join('L')}).join(' ');
  }
  var h='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="90" style="display:block">';
  [0,0.5,1].forEach(function(g){h+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="#F0E4D6" stroke-width="1"/>';});
  h+='<path d="'+path(md)+'" fill="none" stroke="var(--math)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  h+='<path d="'+path(pd)+'" fill="none" stroke="var(--py)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  md.forEach(function(v,i){if(v!==null)h+='<circle cx="'+(pl+i*step).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="2.6" fill="var(--math)"/>'});
  pd.forEach(function(v,i){if(v!==null)h+='<circle cx="'+(pl+i*step).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="2.6" fill="var(--py)"/>'});
  h+='<text x="'+pl+'" y="'+(H-3)+'" font-size="9" fill="#8A7C6B">'+cnDate(days[0])+'</text>';
  h+='<text x="'+(W-pr)+'" y="'+(H-3)+'" font-size="9" fill="#8A7C6B" text-anchor="end">今天</text>';
  h+='</svg>';
  return h;
}

/* ================= 设置 ================= */
function viewSet(){
  var h='<div class="hd"><div class="grow"><div class="tt">⚙️ 设置</div><div class="dt">题量和题型随时可以改</div></div></div>';
  h+='<div class="card"><h3>👧 基本信息</h3><div class="set"><div class="grow"><div class="lb">孩子的名字</div><div class="sb">显示在首页</div></div><input id="cname" value="'+esc(S.child)+'" style="width:120px;padding:9px;border:1px solid var(--line);border-radius:11px;text-align:right;font-size:15px" onchange="setName(this.value)"></div></div>';

  h+='<div class="card"><h3>🔢 数学</h3>';
  h+='<div class="set"><div class="grow"><div class="lb">每天题量</div><div class="sb">今天想做几道就设几道</div></div>'+stepperHTML('mc',S.math.count,1,60,1,function(v){S.math.count=v;save()})+'</div>';
  h+='<div class="set"><div class="grow"><div class="lb">难度</div><div class="sb">'+levelName()+'</div></div><div class="row">'+['easy','std','hard'].map(function(k){return '<button class="chip'+(S.math.level===k?' on':'')+'" onclick="setLevel(\''+k+'\')">'+({easy:'5以内',std:'标准',hard:'全题型'})[k]+'</button>'}).join('')+'</div></div>';
  h+='<div style="padding-top:12px"><div class="lb">题型（至少选一个）</div><div class="chips">'+MATH_TYPES.map(function(t){return '<button class="chip'+(S.math.types.indexOf(t.k)>=0?' on':'')+'" onclick="toggleType(\''+t.k+'\')">'+t.n+' <span style="opacity:.7">'+t.d+'</span></button>'}).join('')+'</div></div>';
  h+='</div>';

  var tot=pyTotal();
  h+='<div class="card"><h3>🗣️ 拼音 <span class="muted" style="font-weight:400">共 '+tot+' 张</span></h3>';
  PY_TYPES.forEach(function(t){
    h+='<div class="set"><div class="grow"><div class="lb">'+t.n+'</div><div class="sb">'+t.d+'</div></div>'+stepperHTML('pc_'+t.k,S.py.counts[t.k]||0,0,20,1,function(v){S.py.counts[t.k]=v;save()})+'</div>';
  });
  h+='<div class="set"><div class="grow"><div class="lb">显示汉字</div><div class="sb">关掉后只看拼音，难度更高</div></div><button class="chip'+(S.py.showHz?' on':'')+'" onclick="toggle(\'showHz\')">'+(S.py.showHz?'开':'关')+'</button></div>';
  h+='<div class="set"><div class="grow"><div class="lb">朗读示范按钮</div><div class="sb">手机语音可能不标准，仅供参考</div></div><button class="chip'+(S.py.speak?' on':'')+'" onclick="toggle(\'speak\')">'+(S.py.speak?'开':'关')+'</button></div>';
  h+='</div>';

  h+='<div class="card"><h3>💾 数据</h3>';
  h+='<button class="btn g" onclick="exportData()">导出记录（备份）</button>';
  h+='<button class="btn g" style="margin-top:10px" onclick="document.getElementById(\'imp\').click()">导入记录</button>';
  h+='<input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(this)">';
  h+='<button class="btn g" style="margin-top:10px;color:var(--bad)" onclick="clearData()">清空全部记录</button>';
  h+='<div class="muted" style="margin-top:10px">数据保存在这台设备的浏览器里，换手机请先导出再导入。</div></div>';
  h+='<div class="muted" style="text-align:center;padding:8px 0 20px">每天题目都不一样 · 错题会自动反复出现</div>';
  return h;
}
function setName(v){S.child=v.slice(0,8)||'宝贝';save();render()}
function setLevel(k){S.math.level=k;save();render()}
function toggleType(k){
  var i=S.math.types.indexOf(k);
  if(i>=0){if(S.math.types.length<=1){toast('至少留一个题型');return}S.math.types.splice(i,1)}
  else S.math.types.push(k);
  save();render();
}
function toggle(k){S.py[k]=!S.py[k];save();render()}
function exportData(){
  var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='练习记录-'+todayKey()+'.json';a.click();
  toast('已导出');
}
function importData(el){
  var f=el.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{var o=JSON.parse(rd.result);if(!o.records)throw 0;S=mergeObj(o);save();toast('导入成功');render()}
    catch(e){toast('文件格式不对')}
  };
  rd.readAsText(f);el.value='';
}
function mergeObj(o){
  var d=JSON.parse(JSON.stringify(DEF));
  d.child=o.child||d.child;
  if(o.math){d.math=o.math}
  if(o.py){d.py=o.py}
  d.records=o.records||{};d.weak=o.weak||{};d.off=o.off||{};
  return d;
}
function clearData(){
  openSheet('<h3 style="margin:0">确认清空？</h3><div class="muted" style="margin-top:6px">所有练习记录和错题都会被删除，无法恢复</div>','',
    [{t:'确认清空',c:'no',f:function(){S=JSON.parse(JSON.stringify(DEF));save();closeSheet();go('home');toast('已清空')}},{t:'取消',c:'g',f:closeSheet}]);
}

/* ================= 通用组件 ================= */
var STEPV={};
function stepperHTML(id,v,min,max,step,onch){
  STEPV[id]=v;
  return '<div class="stepper"><button onclick="st(\''+id+'\','+(-step)+','+min+','+max+',\''+(onch?'1':'')+'\')">−</button><span id="sv_'+id+'">'+v+'</span><button onclick="st(\''+id+'\','+step+','+min+','+max+',\''+(onch?'1':'')+'\')">＋</button></div>';
}
function st(id,d,min,max,live){
  var v=(STEPV[id]||0)+d;
  if(v<min)return;if(v>max)return;
  STEPV[id]=v;
  var el=document.getElementById('sv_'+id);if(el)el.textContent=v;
  if(live){
    if(id==='mc'){S.math.count=v;save()}
    if(id.indexOf('pc_')===0){S.py.counts[id.slice(3)]=v;save()}
  }
}
var SHEET=null;
function openSheet(title,body,btns){
  closeSheet();
  var d=document.createElement('div');d.className='sheet';d.id='sheet';
  var h='<div class="box">'+title+body+'<div style="margin-top:14px">';
  btns.forEach(function(b,i){h+='<button class="btn '+b.c+'" style="margin-top:8px" data-i="'+i+'">'+b.t+'</button>'});
  h+='</div></div>';
  d.innerHTML=h;
  d.addEventListener('click',function(e){if(e.target===d)closeSheet()});
  document.body.appendChild(d);
  d.querySelectorAll('.btn').forEach(function(b){b.onclick=function(){btns[+b.dataset.i].f()}});
  SHEET=d;
}
function closeSheet(){if(SHEET&&SHEET.parentNode)SHEET.parentNode.removeChild(SHEET);SHEET=null}

/* ================= 启动 ================= */
document.querySelectorAll('#tabs button').forEach(function(b){
  b.onclick=function(){go(b.dataset.t)};
});
render();

</script>
</body>
</html>
